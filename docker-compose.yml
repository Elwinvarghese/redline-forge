services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgetrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_lab_only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks: [forge_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forgetrack"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: ./app
    environment:
      DATABASE_URL: postgresql://forge_app:forge_app_lab_password@db:5432/forgetrack
      FLASK_ENV: production
    ports: ["80:8080"]
    depends_on:
      db:
        condition: service_healthy
    networks: [forge_edge, forge_internal]
    restart: unless-stopped
networks:
  forge_edge:
  forge_internal:
    internal: true
volumes:
  pgdata:
